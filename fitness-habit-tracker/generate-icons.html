<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PWA Icon Generator</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      max-width: 500px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      color: #6366f1;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    button {
      background-color: #6366f1;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: #4f46e5;
    }
    .preview-container {
      margin: 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>PWA Icon Generator</h1>
    <p>Generate high-resolution PNG icons for your Fitness Habit Tracker PWA.</p>
    
    <div class="preview-container" id="svgContainer"></div>

    <div class="btn-group">
      <button onclick="downloadIcon(192, 'icon-192.png')">Download icon-192.png</button>
      <button onclick="downloadIcon(512, 'icon-512.png')">Download icon-512.png</button>
    </div>
  </div>

  <canvas id="exportCanvas"></canvas>

  <script>
    function getSvgString(size) {
      return `
      <svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 512 512">
        <defs>
          <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#1e1b4b" />
          </linearGradient>
          <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f97316" />
            <stop offset="100%" stop-color="#ef4444" />
          </linearGradient>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366f1" />
            <stop offset="100%" stop-color="#a855f7" />
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
        <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="24" stroke-dasharray="10 15" />
        <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="24" stroke-linecap="round" stroke-dasharray="1005" stroke-dashoffset="300" transform="rotate(-90 256 256)" />
        <path d="M256 120 C256 120, 310 180, 310 240 C310 270, 290 310, 256 310 C222 310, 202 270, 202 240 C202 180, 256 120, 256 120 Z" fill="url(#flameGrad)" />
        <path d="M256 200 C256 200, 280 230, 280 255 C280 270, 270 290, 256 290 C242 290, 232 270, 232 255 C232 230, 256 200, 256 200 Z" fill="#fde047" />
      </svg>
      `;
    }
    document.getElementById('svgContainer').innerHTML = getSvgString(160);
    function downloadIcon(dimension, filename) {
      const canvas = document.getElementById('exportCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = dimension;
      canvas.height = dimension;

      const svgData = getSvgString(dimension);
      const img = new Image();
      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);

      img.onload = function () {
        ctx.clearRect(0, 0, dimension, dimension);
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        const a = document.createElement('a');
        a.download = filename;
        a.href = canvas.toDataURL('image/png');
        a.click();
      };
      img.src = url;
    }
  </script>
</body>
</html>
